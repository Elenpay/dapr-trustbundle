{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dapr-trustbundle.fullname" . }}-controller-manager
  namespace: {{ include "dapr-trustbundle.namespace" . }}
  labels:
    {{- include "dapr-trustbundle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dapr-trustbundle.controllerSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 2 }}
  {{- else }}
  egress:
  - {} # Allow all egress traffic by default
  {{- end }}
{{- end }}
