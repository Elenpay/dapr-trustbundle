{{- if and .Values.rbac.create (not .Values.rbac.useClusterRole) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dapr-trustbundle.fullname" . }}-manager-rolebinding
  namespace: {{ .Values.controller.targetNamespace }}
  labels:
    {{- include "dapr-trustbundle.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dapr-trustbundle.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "dapr-trustbundle.serviceAccountName" . }}
  namespace: {{ include "dapr-trustbundle.namespace" . }}
---
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dapr-trustbundle.fullname" . }}-leader-election-rolebinding
  namespace: {{ include "dapr-trustbundle.namespace" . }}
  labels:
    {{- include "dapr-trustbundle.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dapr-trustbundle.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "dapr-trustbundle.serviceAccountName" . }}
  namespace: {{ include "dapr-trustbundle.namespace" . }}
{{- end }}
